[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cardmarket-scrapedo"
version = "0.1.0"
description = "Unofficial Cardmarket API for Python: card prices, all offers, price history, expansions and sellers for MTG, Pokemon, Yu-Gi-Oh!, One Piece, Lorcana and more, without Cloudflare blocks (via Scrape.do)"
keywords = ["cardmarket", "cardmarket-api", "cardmarket-scraper", "mtg", "pokemon-tcg", "yugioh", "one-piece-tcg", "lorcana", "tcg-prices", "price-tracker", "web-scraping", "cloudflare", "scrape-do"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Games/Entertainment",
]
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "lxml>=4.9"]

[project.urls]
Homepage = "https://github.com/batuzyn/cardmarket-api"
Repository = "https://github.com/batuzyn/cardmarket-api"
Issues = "https://github.com/batuzyn/cardmarket-api/issues"
"Scrape.do" = "https://scrape.do/?utm_source=github&utm_medium=repo_cardmarket"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cardmarket = "cardmarket_scrapedo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Scrape.do API (needs SCRAPEDO_TOKEN and RUN_LIVE=1)"]
